name: Create Release

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const fs = require('node:fs');
            const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            const manifest = JSON.parse(fs.readFileSync('manifest.chrome.json', 'utf8'));
            if (tagVersion !== manifest.version) {
              console.error(\`Tag version (\${tagVersion}) does not match manifest.chrome.json version (\${manifest.version})\`);
              process.exit(1);
            }
            console.log(\`Tag version \${tagVersion} matches manifest.\`);
          "

      - name: Install dependencies
        run: npm ci

      - name: Build, package, and validate
        run: make validate

      - name: Create Firefox source archive
        if: startsWith(github.ref, 'refs/tags/')
        run: git archive --format=zip --output=dist/firefox-source.zip HEAD

      - name: Upload store packages artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: |
            dist/chrome-extension.zip
            dist/firefox-extension.zip
            dist/firefox-source.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/chrome-extension.zip
            dist/firefox-extension.zip
            dist/bookmarklet-bundled.txt
            dist/bookmarklet-loader.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy-pages:
    name: Deploy Bookmarklet Page
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish-chrome:
    name: Publish to Chrome Web Store
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download store packages
        uses: actions/download-artifact@v4
        with:
          name: store-packages
          path: dist

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and publish to Chrome Web Store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID || 'lclohacjbfchomeeopaffkedfnbjicdn' }}
          CWS_ZIP_PATH: dist/chrome-extension.zip
        run: node scripts/publish-chrome.mjs

  publish-firefox:
    name: Publish to Firefox Add-ons
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: firefox-add-ons
    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download store packages
        uses: actions/download-artifact@v4
        with:
          name: store-packages
          path: dist

      - name: Upload and submit to Firefox Add-ons
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_ZIP_PATH: dist/firefox-extension.zip
          AMO_SOURCE_PATH: dist/firefox-source.zip
        run: node scripts/publish-firefox.mjs